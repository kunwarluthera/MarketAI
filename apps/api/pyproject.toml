[project]
name = "market-ai-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic-settings>=2.4", "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2", "redis>=5", "argon2-cffi>=23.1", "python-jose[cryptography]>=3.3", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: PostgreSQL-backed integration verification"]

[tool.ruff]
line-length = 100
target-version = "py311"
