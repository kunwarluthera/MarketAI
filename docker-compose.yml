services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: market_ai, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    ports: ["5432:5432"]
    volumes: [market_ai_db:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres -d market_ai"], interval: 5s, timeout: 3s, retries: 12}
    deploy: {resources: {limits: {memory: 512M}}}
  test-db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: market_ai_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    ports: ["5433:5432"]
    volumes: [market_ai_test_db:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres -d market_ai_test"], interval: 2s, timeout: 3s, retries: 30, start_period: 5s}
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 12}
    deploy: {resources: {limits: {memory: 128M}}}
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    env_file: [.env]
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 10s, timeout: 3s, retries: 10}
  worker:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    command: ["python", "/worker/worker.py"]
    volumes: ["./apps/worker:/worker:ro"]
    env_file: [.env]
    environment:
      PYTHONPATH: /app
    depends_on: {redis: {condition: service_healthy}}
  web:
    build: {context: ., dockerfile: apps/web/Dockerfile}
    environment: {VITE_API_URL: "http://localhost:8000/api/v1"}
    ports: ["5173:5173"]
    depends_on: {api: {condition: service_healthy}}
volumes: {market_ai_db: {}, market_ai_test_db: {}}
